<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="node-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-20px, 15px); opacity: 0.55; }
    }
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatWaveSlow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -120; }
    }
    @keyframes soundBar {
      0%, 100% { height: 12px; y: 274px; }
      50% { height: 36px; y: 250px; }
    }
    @keyframes soundBar2 {
      0%, 100% { height: 28px; y: 258px; }
      50% { height: 10px; y: 276px; }
    }
    @keyframes soundBar3 {
      0%, 100% { height: 20px; y: 266px; }
      50% { height: 42px; y: 244px; }
    }

    .bg-orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .floating-card1 { animation: floatWave 5s ease-in-out infinite; }
    .floating-card2 { animation: floatWaveSlow 6s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8, 8; animation: dashTravel 3s linear infinite; }
    .bar-1 { animation: soundBar 1.2s ease-in-out infinite; }
    .bar-2 { animation: soundBar2 1.4s ease-in-out infinite 0.2s; }
    .bar-3 { animation: soundBar3 1.1s ease-in-out infinite 0.4s; }
    .bar-4 { animation: soundBar 1.5s ease-in-out infinite 0.6s; }
    .bar-5 { animation: soundBar2 1.3s ease-in-out infinite 0.1s; }
    .bar-6 { animation: soundBar3 1.6s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Background Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Light Orbs (Background depth) -->
  <circle class="bg-orb1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#node-glow)" />
  <circle class="bg-orb2" cx="1020" cy="220" r="160" fill="#8b5cf6" filter="url(#node-glow)" />

  <!-- Dynamic Circuit Flow / Pipelines in Background -->
  <g opacity="0.45">
    <!-- Connecting Paths -->
    <path class="stream-line" d="M 80,180 Q 200,90 350,160 T 650,150 T 950,120 T 1120,200" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 120,260 Q 300,310 500,240 T 800,280 T 1100,250" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Left Dynamic Element: Voice Wave Audio Spectrum -->
  <g class="floating-card1" opacity="0.85">
    <rect x="55" y="235" width="130" height="65" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="70" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">VOICE PIPELINE</text>
    <rect class="bar-1" x="72" y="260" width="6" height="24" rx="3" fill="#38bdf8" />
    <rect class="bar-2" x="84" y="265" width="6" height="19" rx="3" fill="#818cf8" />
    <rect class="bar-3" x="96" y="258" width="6" height="26" rx="3" fill="#c084fc" />
    <rect class="bar-4" x="108" y="262" width="6" height="22" rx="3" fill="#38bdf8" />
    <rect class="bar-5" x="120" y="268" width="6" height="16" rx="3" fill="#818cf8" />
    <rect class="bar-6" x="132" y="255" width="6" height="29" rx="3" fill="#f43f5e" />
    <circle cx="158" cy="272" r="5" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Right Dynamic Element: Multi-Agent Handoff Node -->
  <g class="floating-card2" opacity="0.85">
    <rect x="1015" y="60" width="130" height="70" rx="10" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="1028" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">AGENT ORCHESTRATION</text>
    <circle cx="1040" cy="104" r="10" fill="#3b82f6" />
    <text x="1037" y="108" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">A1</text>
    <line x1="1050" y1="104" x2="1070" y2="104" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="1080" cy="104" r="12" fill="#8b5cf6" filter="url(#glow)" />
    <text x="1075" y="108" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">LLM</text>
    <line x1="1092" y1="104" x2="1112" y2="104" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3" />
    <circle cx="1122" cy="104" r="10" fill="#ec4899" />
    <text x="1118" y="108" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">TTS</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Subtitle & Ecosystem Highlights -->
  <!-- Category Pill Badge -->
  <g transform="translate(600, 68)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <circle cx="-140" cy="0" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="4.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">
      CURATED ECOSYSTEM DIRECTORY
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primary-glow)" filter="url(#glow)" letter-spacing="-0.5">
    Awesome Conversational AI Frameworks
  </text>

  <!-- Subtitle -->
  <text x="600" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
    Enterprise SaaS Platforms • Autonomous Agents • Open-Source Real-Time Voice Pipelines
  </text>

  <!-- Descriptive Tagline -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    From low-code dialogue flow builders &amp; cognitive bots to streaming speech pipelines &amp; multi-agent architectures
  </text>

  <!-- Interactive/Dynamic Indicator Badges in Center Foreground -->
  <g transform="translate(350, 260)">
    <rect x="0" y="0" width="145" height="34" rx="17" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" opacity="0.95" />
    <text x="72" y="21" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎙️ Real-Time Voice</text>
  </g>

  <g transform="translate(525, 260)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" />
    <text x="75" y="21" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">🤖 Agent Orchestration</text>
  </g>

  <g transform="translate(705, 260)">
    <rect x="0" y="0" width="145" height="34" rx="17" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" opacity="0.95" />
    <text x="72" y="21" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ Enterprise CX</text>
  </g>

  <!-- Border Accent -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1" opacity="0.4" />
</svg>
