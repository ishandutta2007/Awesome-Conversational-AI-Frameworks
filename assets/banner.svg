<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="accent-pink" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="node-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(15px,-10px);opacity:.6}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.2) translate(-20px,15px);opacity:.55}}@keyframes floatWave{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatWaveSlow{0%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes soundBar{0%{height:12px;y:274px}50%{height:36px;y:250px}}@keyframes soundBar2{0%{height:28px;y:258px}50%{height:10px;y:276px}}@keyframes soundBar3{0%{height:20px;y:266px}50%{height:42px;y:244px}}.bg-orb1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.bg-orb2{animation:pulseOrb2 10s ease-in-out infinite;transform-origin:1000px 250px}.floating-card1{animation:floatWave 5s ease-in-out infinite}.floating-card2{animation:floatWaveSlow 6s ease-in-out infinite}.stream-line{stroke-dasharray:8,8;animation:dashTravel 3s linear infinite}.bar-1{animation:soundBar 1.2s ease-in-out infinite}.bar-2{animation:soundBar2 1.4s ease-in-out infinite .2s}.bar-3{animation:soundBar3 1.1s ease-in-out infinite .4s}.bar-4{animation:soundBar 1.5s ease-in-out infinite .6s}.bar-5{animation:soundBar2 1.3s ease-in-out infinite .1s}.bar-6{animation:soundBar3 1.6s ease-in-out infinite .5s}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="220" cy="120" r="140" fill="#38bdf8" class="bg-orb1" filter="url(#node-glow)"/><circle cx="1020" cy="220" r="160" fill="#8b5cf6" class="bg-orb2" filter="url(#node-glow)"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 80,180 Q 200,90 350,160 T 650,150 T 950,120 T 1120,200" class="stream-line"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 120,260 Q 300,310 500,240 T 800,280 T 1100,250" class="stream-line"/></g><g class="floating-card1" opacity=".85"><rect width="130" height="65" x="55" y="235" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" rx="10"/><text x="70" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">VOICE PIPELINE</text><rect width="6" height="24" x="72" y="260" fill="#38bdf8" class="bar-1" rx="3"/><rect width="6" height="19" x="84" y="265" fill="#818cf8" class="bar-2" rx="3"/><rect width="6" height="26" x="96" y="258" fill="#c084fc" class="bar-3" rx="3"/><rect width="6" height="22" x="108" y="262" fill="#38bdf8" class="bar-4" rx="3"/><rect width="6" height="16" x="120" y="268" fill="#818cf8" class="bar-5" rx="3"/><rect width="6" height="29" x="132" y="255" fill="#f43f5e" class="bar-6" rx="3"/><circle cx="158" cy="272" r="5" fill="#10b981" filter="url(#glow)"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle></g><g class="floating-card2" opacity=".85"><rect width="130" height="70" x="1015" y="60" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" rx="10"/><text x="1028" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">AGENT ORCHESTRATION</text><circle cx="1040" cy="104" r="10" fill="#3b82f6"/><text x="1037" y="108" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold">A1</text><line x1="1050" x2="1070" y1="104" y2="104" stroke="#818cf8" stroke-dasharray="3 3" stroke-width="2"/><circle cx="1080" cy="104" r="12" fill="#8b5cf6" filter="url(#glow)"/><text x="1075" y="108" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">LLM</text><line x1="1092" x2="1112" y1="104" y2="104" stroke="#818cf8" stroke-dasharray="3 3" stroke-width="2"/><circle cx="1122" cy="104" r="10" fill="#ec4899"/><text x="1118" y="108" fill="#fff" font-family="sans-serif" font-size="9" font-weight="bold">TTS</text></g><g transform="translate(600, 68)"><rect width="320" height="28" x="-160" y="-14" fill="#1e293b" stroke="